<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Unicorns — every billion-euro company, sourced</title>
<meta name="description" content="Every current German unicorn, with every valuation dated and linked to the reporting behind it.">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/hero.css">
<link rel="stylesheet" href="assets/css/register.css">
<link rel="stylesheet" href="assets/css/funding.css">
<link rel="stylesheet" href="assets/css/detail.css">
</head>
<body>
<a class="visually-hidden" href="#register">Skip to the companies</a>

<header class="topbar" data-topbar hidden>
  <a class="topbar__mark" href="#register">GERMAN&nbsp;UNICORNS</a>
  <!-- The map has no entry of its own. It is a way of looking at the companies,
       not a separate destination, so it is reached from the grid/map toggle
       inside the register and from nowhere else. -->
  <nav class="topbar__nav" aria-label="Main">
    <a href="#register" data-companies-link>Companies</a>
    <a href="#funding">Funding</a>
    <a href="about.html">About</a>
    <button type="button" data-open-search aria-label="Search companies">Search</button>
  </nav>
</header>

<section class="hero" id="top" data-hero>
  <canvas class="hero__canvas" data-constellation aria-hidden="true"></canvas>
  <div class="hero__inner">
    <p class="label hero__eyebrow">A register of German unicorns</p>
    <h1 class="hero__title"><span>Europe's industrial heart</span> <span>now runs on software.</span></h1>
    <button class="hero__cta" type="button" data-enter>
      Enter the register
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M7 1v12M2 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </div>
</section>

<main class="register" id="register" data-register hidden>
  <section class="stats" data-stats aria-label="Ecosystem at a glance"></section>
  <section class="controls" data-controls></section>
  <div class="grid" data-grid role="list"></div>
  <div class="map" data-map hidden></div>
</main>

<!-- The weekly funding round-up: German rounds generally, not only unicorns.
     Hidden alongside the register until the hero transition completes, so the
     landing view stays the hero alone. -->
<section class="roundup" id="funding" data-roundup aria-label="Weekly funding round-up" hidden></section>

<dialog class="city" data-city-window aria-label="Companies in this city"></dialog>
<dialog class="detail" data-detail aria-label="Company detail"></dialog>

<footer class="footer" data-footer></footer>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
