name: weekly-funding

# One week of the funding round-up, proposed as a pull request.
#
# It never commits to main and it never publishes: a person reads the diff,
# checks the links, and merges. Everything this job produces is a proposal.
#
# THE ROUTINE DEGRADES; IT DOES NOT FAIL.
# Writing the lead round-ups is a model call, and the operator has chosen not to
# hold an ANTHROPIC_API_KEY. Those two facts used to be in conflict, and the
# schedule was switched off to resolve it. They are not in conflict any more:
# the job picks its mode from what the repository actually has.
#
#   full mode       ANTHROPIC_API_KEY is set. Claude selects the lead round(s),
#                   writes them up, and compiles the supporting list.
#   list-only mode  the secret is absent, or a run asked for it. NO model call
#                   is made. The week's German rounds are read out of the same
#                   allowlisted feeds and published with an empty `lead` and the
#                   rounds in `more` — company, amount, currency, source link
#                   and publication date each lifted from the headline that
#                   states them. Nothing invented, nothing written in prose.
#
# Both modes end the same way: write the week file, rebuild, validate, open a
# pull request. If validation fails, nothing is published and the run fails.
on:
  # The whole point of the routine. 07:00 UTC every Monday, covering the week
  # that just ended. Live, not commented out: with list-only mode there is no
  # longer a configuration in which the schedule can only produce red runs.
  schedule: [{ cron: "0 7 * * 1" }]

  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to draft, e.g. "2026-W30". Blank = the week that just ended.'
        required: false
        type: string
      list_only:
        description: "Publish as a list with no write-ups, even if the API key exists."
        required: false
        default: false
        type: boolean

  # Fired by an external system with an HTTP POST. See docs/UPDATING.md for the
  # curl and the token scope it needs. The optional week travels in the payload
  # because repository_dispatch has no `inputs`.
  repository_dispatch:
    types: [draft-funding-week]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two runs drafting the same week would race on the same branch. Queue them
  # rather than cancelling: a half-pushed branch is worse than a slow one.
  group: weekly-funding
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # FIRST, before anything costs time or makes a network call, so the run
      # log opens by saying what it is about to do and why. There is no failure
      # path here: a missing secret selects a mode, it does not stop the job.
      - name: Choose the mode
        id: mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_LIST: ${{ inputs.list_only }}
        run: |
          set -euo pipefail
          FORCE_LIST="${FORCE_LIST:-}"
          ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}"
          if [ "${FORCE_LIST}" = "true" ]; then
            echo "mode=list" >> "$GITHUB_OUTPUT"
            echo "::notice title=List-only mode (requested)::This run was asked for a list rather than a write-up. No model call will be made."
          elif [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "mode=list" >> "$GITHUB_OUTPUT"
            echo "::notice title=List-only mode::No ANTHROPIC_API_KEY is set, so this week is published as a list of sourced rounds rather than written up. No model call is made and nothing is invented. To get written lead rounds, add the secret — see docs/UPDATING.md."
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full mode::ANTHROPIC_API_KEY is present; the lead rounds will be written up."
          fi

      # workflow_dispatch carries the week in `inputs`; repository_dispatch has
      # no inputs and carries it in client_payload. Both are optional, and blank
      # means the week that just ended.
      - name: Resolve the week
        id: week
        env:
          FROM_DISPATCH: ${{ inputs.week }}
          FROM_PAYLOAD: ${{ github.event.client_payload.week }}
        run: |
          set -euo pipefail
          FROM_DISPATCH="${FROM_DISPATCH:-}"
          FROM_PAYLOAD="${FROM_PAYLOAD:-}"
          WEEK="${FROM_DISPATCH:-$FROM_PAYLOAD}"
          if [ -n "$WEEK" ] && ! printf '%s' "$WEEK" | grep -Eq '^[0-9]{4}-W[0-9]{2}$'; then
            echo "::error title=Bad week id::Expected something like 2026-W30, got '${WEEK}'. Nothing was drafted."
            exit 1
          fi
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          echo "Week: ${WEEK:-(the week that just ended)}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Only full mode needs it. List-only makes no API call, so installing the
      # SDK there would be a dependency the run does not use.
      - name: Install the Anthropic SDK
        if: steps.mode.outputs.mode == 'full'
        run: pip install --quiet anthropic

      # Exit codes are load-bearing here:
      #   0  a week was drafted or listed, and written
      #   2  the feeds carried no German funding news for that week, or none
      #      that could be read into a round — a real and unremarkable outcome,
      #      not a failure. Nothing is written, and no pull request is opened.
      #   1  something was produced but could not be traced back to the articles
      #      that were fetched, or failed validation. Nothing is written, and
      #      the job fails loudly.
      - name: Draft the week
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEEK: ${{ steps.week.outputs.week }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          WEEK="${WEEK:-}"
          if [ -n "$WEEK" ]; then ARGS="--week $WEEK"; else ARGS="--last-complete-week"; fi
          if [ "$MODE" = "list" ]; then ARGS="$ARGS --list-only"; fi
          python tools/weekly_funding.py $ARGS --report funding-report.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "quiet=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No German funding news this week::The allowlisted feeds carried nothing that qualified, so there is nothing to propose. No file was written and no pull request was opened. This is a normal outcome, not a failure."
            exit 0
          fi
          exit $code

      - name: Rebuild the generated payloads
        if: steps.draft.outputs.quiet != 'true'
        run: python tools/build.py

      # The written file has already been validated in-process before it was
      # saved. This runs the validator again, from the command line, against
      # what is actually on disk — the same gate CI applies to a human's edit.
      # A week that cannot pass it must never reach a pull request.
      - name: Validate before proposing anything
        if: steps.draft.outputs.quiet != 'true'
        run: |
          python tools/validate_funding.py
          python tools/validate.py

      - name: Open the pull request
        id: pr
        if: steps.draft.outputs.quiet != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WEEK=$(python -c "import json;print(json.load(open('funding-report.json'))['week'])")
          MODE=$(python -c "import json;print(json.load(open('funding-report.json'))['mode'])")
          BRANCH="funding/${WEEK}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Only the round-up's own files. companies.json is regenerated above
          # so the validator runs against a real build, but this job has no
          # business proposing register changes.
          git add "data/funding/${WEEK}.json" data/funding.json
          if git diff --staged --quiet; then
            echo "::notice::Nothing changed; no pull request opened."
            exit 0
          fi
          git commit -m "feat: funding round-up for ${WEEK}"
          git push --force-with-lease origin "$BRANCH"

          python - <<'PY' > pr-body.md
          import json
          r = json.load(open("funding-report.json"))
          listed = r.get("mode") == "list-only"
          def line(e):
              return (f"- **{e['company']}** — {e['currency']} {e['amount']}m · "
                      f"[source]({e['url']}) · {e['publishedOn']}")
          print(f"Compiled from {r['articles']} article(s) in the allowlisted feeds "
                f"for ISO week {r['week']}.\n")
          if listed:
              print("## This week is a list, not a write-up\n")
              print("No `ANTHROPIC_API_KEY` was available to this run, so no model "
                    "was called and nothing was written in prose. Every round below "
                    "was read out of the headline of the page it links to — company, "
                    "amount, currency, source and date — and the week is published "
                    "with an empty `lead`. The page says so where the write-up would "
                    "have been. Nothing here was inferred, and any round whose "
                    "headline could not be read cleanly was dropped rather than "
                    "guessed at.\n")
          if r["tracked"]:
              print("## ⚠️ Companies already in the register\n")
              print("These raised this week **and** have an entry in `data/companies/`. "
                    "The register entry is now out of date — update it in this pull "
                    "request or immediately after it, so the round-up is not the only "
                    "place the new figure appears.\n")
              for t in r["tracked"]:
                  print(f"- **{t['company']}** → `data/companies/{t['slug']}.json` "
                        f"— {t['currency']} {t['amount']}m · [source]({t['source']})")
              print()
          if not listed:
              print("## Lead write-ups\n")
              print("\n".join(line(e) for e in r["lead"]) or "_none_")
              print("\n## Also raised\n")
          else:
              print("## Rounds\n")
          print("\n".join(line(e) for e in r["more"]) or "_none_")
          if r["feedErrors"]:
              print("\n## Feed errors\n")
              for err in r["feedErrors"]:
                  print(f"- {err}")
          print("\n---\n")
          print("**Before merging:** open every source link and check the figure, the "
                "founders and the date against the page. Every round here is linked and "
                "dated, but — unlike the register — none of it is quote-checked, so the "
                "review *is* the check.")
          if listed:
              print("For a listed week, the company name and the figure were parsed "
                    "from the headline, so the thing most worth checking is that each "
                    "name is the company and not a fragment of the sentence around it.\n")
          else:
              print("Read the lead write-ups for claims the sources do not support, "
                    "especially superlatives.\n")
          print("Nothing has been published. Merging this opens the usual rebuild path.")
          PY

          TITLE="Funding round-up: ${WEEK}"
          if [ "$MODE" = "list-only" ]; then
            TITLE="${TITLE} (listed, not written up)"
          fi
          if [ -n "$(python -c "import json;print('x' if json.load(open('funding-report.json'))['tracked'] else '')")" ]; then
            TITLE="${TITLE} (touches the register)"
          fi
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Optional, and off unless the repository asks for it. With
      # FUNDING_AUTO_MERGE set to true (Settings → Secrets and variables →
      # Actions → Variables) the pull request lands by itself once validate.yml
      # passes, and the site updates with nobody in the loop. Unset — the
      # default — it waits for a person, which is the reviewed path and the one
      # this project is built around. Auto-merge must also be enabled for the
      # repository itself (Settings → General → Allow auto-merge); if it is not,
      # the pull request simply stays open, which is the safe failure.
      - name: Enable auto-merge, if the repository asks for it
        if: steps.pr.outputs.branch != '' && vars.FUNDING_AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh pr merge --squash --auto "${{ steps.pr.outputs.branch }}"; then
            echo "::notice title=Auto-merge enabled::FUNDING_AUTO_MERGE is true, so this pull request will merge itself once validate.yml passes. No one has read it."
          else
            echo "::warning title=Auto-merge could not be enabled::The pull request is open and waiting for a human. Check Settings → General → Allow auto-merge."
          fi
