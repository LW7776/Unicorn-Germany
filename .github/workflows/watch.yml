name: watch

# The full register sweep. It used to run monthly, back when it was the only
# thing looking at the feeds. weekly-funding.yml now reads the same feeds every
# Monday, so new rounds — and the new unicorns they create — surface within
# days rather than waiting for the 1st of the month. What this sweep is for is
# everything a funding announcement does not announce: a quiet IPO, an
# acquisition, an insolvency, and valuations that have simply gone stale
# because nobody has repriced the company in two years. That work does not need
# to happen monthly, so it now runs every eight weeks.
on:
  # GitHub's cron has no "every eight weeks", so this fires weekly and the job
  # gates on the ISO week number. Eight divides the year unevenly (a 52-week
  # year gives six sweeps and a 53-week year gives seven), which is fine: the
  # point is a steady cadence of roughly six a year, not an exact anniversary.
  schedule: [{ cron: "0 6 * * 1" }]     # 06:00 UTC every Monday; gated below
  workflow_dispatch:                     # the manual trigger — never gated

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Is this one of the eight-weekly sweeps?
        id: due
        run: |
          WEEK=$(date -u +%V)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — sweeping regardless of the schedule."
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif [ $((10#$WEEK % 8)) -eq 0 ]; then
            echo "ISO week $WEEK is a sweep week."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "ISO week $WEEK is not a sweep week; the weekly funding scan covers the interim."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.due.outputs.due == 'true'
      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with: { python-version: "3.11" }
      - run: python tools/watch.py
        if: steps.due.outputs.due == 'true'
      - name: Commit the candidate list
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          git diff --staged --quiet || git commit -m "chore: monthly candidate scan"
          git push
      - name: Open the review issue
        if: steps.due.outputs.due == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/candidates.json', 'utf8'));
            if (!data.candidates.length) { core.info('No candidates this month.'); return; }
            // Headlines (and feed-error text) are free text from external feeds, not
            // from this repository — an unbalanced bracket or a stray backtick would
            // otherwise break the link, or silently restyle text as code, in the one
            // artefact this job exists to produce. c.link is a URL and stays
            // unescaped; if it could contain a ')' that would prematurely close the
            // markdown link, angle brackets are the markdown-native way to allow it.
            const escapeMd = (s) => String(s).replace(/[\[\]`]/g, '\\$&');
            const linkFor = (url) => /[()]/.test(url) ? `<${url}>` : url;
            const lines = data.candidates.map(c =>
              `- [ ] **${c.company || 'NEW'}** — [${escapeMd(c.title)}](${linkFor(c.link)}) · ${escapeMd(c.source)} · ${c.published}`);
            const errors = data.feedErrors.length
              ? `\n\nFeed errors:\n${data.feedErrors.map(e => `- ${escapeMd(e)}`).join('\n')}` : '';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `${data.candidates.length} candidate updates — ${data.scannedOn}`,
              body: `Scanned ${data.scannedOn}. Nothing has been changed in the dataset.\n\n`
                  + `This is the eight-weekly full sweep. New funding rounds are caught `
                  + `separately, every Monday, by the [weekly funding round-up](../blob/main/docs/UPDATING.md#the-two-automations). `
                  + `What this sweep is looking for is what a funding announcement never `
                  + `announces: a quiet IPO, an acquisition, an insolvency, or a valuation `
                  + `that has simply gone stale.\n\n`
                  + `${lines.join('\n')}${errors}\n\n`
                  + `To act on these, see [docs/UPDATING.md](../blob/main/docs/UPDATING.md).`,
            });
