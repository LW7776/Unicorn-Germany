name: watch
on:
  schedule: [{ cron: "0 6 1 * *" }]     # 06:00 UTC on the 1st of each month
  workflow_dispatch:                     # the manual trigger

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tools/watch.py
      - name: Commit the candidate list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          git diff --staged --quiet || git commit -m "chore: monthly candidate scan"
          git push
      - name: Open the review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/candidates.json', 'utf8'));
            if (!data.candidates.length) { core.info('No candidates this month.'); return; }
            const lines = data.candidates.map(c =>
              `- [ ] **${c.company || 'NEW'}** — [${c.title}](${c.link}) · ${c.source} · ${c.published}`);
            const errors = data.feedErrors.length
              ? `\n\nFeed errors:\n${data.feedErrors.map(e => `- ${e}`).join('\n')}` : '';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `${data.candidates.length} candidate updates — ${data.scannedOn}`,
              body: `Scanned ${data.scannedOn}. Nothing has been changed in the dataset.\n\n`
                  + `${lines.join('\n')}${errors}\n\n`
                  + `To act on these, see [docs/UPDATING.md](../blob/main/docs/UPDATING.md).`,
            });
